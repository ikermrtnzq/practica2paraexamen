<div class="min-h-screen bg-slate-100 p-6">
    <div class="max-w-7xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-200">
        <h1 class="text-3xl font-extrabold text-center text-white bg-slate-900 py-6">HISTORIAL DE APUESTAS</h1>
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead class="bg-cyan-600 text-white">
                    <tr>
                        <th class="px-6 py-4 font-bold uppercase text-sm">Usuario</th>
                        <th class="px-6 py-4 font-bold uppercase text-sm">Resultado</th>
                        <th class="px-6 py-4 font-bold uppercase text-sm">Fecha</th>
                        <th class="px-6 py-4 font-bold uppercase text-sm text-center">Eliminar</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-200">
                    @for (apuesta of apuestas; track apuesta) {
                        <tr class="hover:bg-cyan-50 transition duration-200 even:bg-gray-50">
                            <td class="px-6 py-4 font-semibold text-gray-800">{{apuesta.usuario}}</td>
                            <td class="px-6 py-4 text-gray-700">{{apuesta.resultado}}</td>
                            <td class="px-6 py-4 text-gray-600">{{apuesta.fecha}}</td>
                            <td class="px-6 py-4 text-center">
                                <button (click)="delete(apuesta.idApuesta)" class="px-4 py-2 bg-red-600 text-white font-semibold rounded-lg hover:bg-red-700 active:scale-95 transition duration-200 shadow-md">🗑 Eliminar</button>
                            </td>
                        </tr>
                    }
                </tbody>
            </table>
        </div>
    </div>
</div>
