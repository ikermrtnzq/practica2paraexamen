<div class="min-h-screen bg-slate-100 flex justify-center items-center p-6">
    <div class="w-full max-w-lg bg-white border-2 border-cyan-500 rounded-2xl shadow-xl p-8">
        <h1 class="text-3xl font-extrabold text-center text-slate-900 mb-6">CREATE APUESTA</h1>
        <form #formCreate="ngForm" action="" class="flex flex-col gap-3">
            <label for="" class="text-sm font-semibold text-gray-700">Id Apuesta:</label>
            <input name="cajaid" #cajaid type="number" class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 transition">
            <label for="" class="text-sm font-semibold text-gray-700">Usuario:</label>
            <input name="cajausuario" #cajausuario type="text" class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 transition">
            <label for="" class="text-sm font-semibold text-gray-700">Resultado:</label>
            <input name="cajaresultado" #cajaresultado type="text" class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 transition">
            <label for="" class="text-sm font-semibold text-gray-700">Fecha:</label>
            <input name="cajafecha" #cajafecha type="text" class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 transition">
            <button (click)="insertarApuesta()" class="w-full mt-4 bg-cyan-600 text-white font-bold py-3 rounded-lg hover:bg-cyan-700 active:scale-95 transition duration-200 shadow-md">Create</button>
        </form>
    </div>
</div>
