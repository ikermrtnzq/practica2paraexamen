@if (jugador) {
    <div class="min-h-screen bg-slate-100 p-6">
    <div class="max-w-7xl mx-auto">
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
            <div class="bg-slate-900 rounded-2xl shadow-xl overflow-hidden border border-slate-700 hover:shadow-2xl hover:-translate-y-2 transition duration-300">
                <h1 class="text-3xl font-extrabold text-center text-white p-6 border-b-2 border-cyan-500">
                    {{jugador.nombre}}
                </h1>
                <img
                    class="w-full h-80 object-cover"
                    src="{{jugador.imagen}}"
                    alt="">
                <div class="p-6 space-y-4">
                    <p class="text-gray-300 bg-slate-800 p-3 rounded-lg border-l-4 border-cyan-500">
                        <span class="font-bold text-cyan-400">Nacimiento:</span>
                        {{jugador.fechaNacimiento}}
                    </p>
                    <p class="text-gray-300 bg-slate-800 p-3 rounded-lg border-l-4 border-cyan-500">
                        <span class="font-bold text-cyan-400">Posición:</span>
                        {{jugador.posicion}}
                    </p>
                    <p class="text-gray-300 bg-slate-800 p-3 rounded-lg border-l-4 border-cyan-500">
                        <span class="font-bold text-cyan-400">País:</span>
                        {{jugador.pais}}
                    </p>
                    <button
                        [routerLink]="['/jugadores', jugador.idEquipo]"
                        class="w-full px-6 py-3 bg-cyan-600 text-white font-bold rounded-xl hover:bg-cyan-700 active:scale-95 transition duration-300 shadow-lg">
                        ← Volver
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
}
