<div class="min-h-screen bg-slate-100 p-6">
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8 max-w-7xl mx-auto">
        <div class="bg-white rounded-2xl shadow-xl overflow-hidden hover:shadow-2xl hover:-translate-y-2 transition duration-300 border border-gray-200">
            <h1 class="text-3xl font-extrabold text-center text-slate-800 px-4 py-6 bg-slate-900 text-white tracking-wide">
                {{equipo.nombre}}
            </h1>
            <img class="w-full h-80 object-cover"
                src="{{equipo.imagen}}" alt="">
            <div class="p-6 space-y-5">
                <p class="text-xl font-bold text-center text-slate-800 bg-cyan-50 border border-cyan-200 rounded-xl py-4">
                    Champions: {{equipo.champions}}
                </p>
                <p class="text-base text-gray-600 text-center leading-relaxed">
                    {{equipo.descripcion}}
                </p>
                <button
                    [routerLink]="['/jugadores', equipo.idEquipo]"
                    class="block w-full px-6 py-3 bg-cyan-600 text-white font-bold rounded-xl hover:bg-cyan-700 active:scale-95 transition duration-200 shadow-md">
                    Ver jugadores
                </button>
                <button
                    [routerLink]="['/']"
                    class="block w-full px-6 py-3 bg-cyan-600 text-white font-bold rounded-xl hover:bg-cyan-700 active:scale-95 transition duration-200 shadow-md">
                    Volver
                </button>

            </div>
        </div>

    </div>
</div>
